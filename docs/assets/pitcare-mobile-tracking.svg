<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" fill="none">
  <!-- Figma Frame: Mobile Live Service Tracking Screen -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="cardGlow" x="-10" y="-10" width="410" height="864" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Screen Background -->
  <rect width="390" height="844" rx="44" fill="url(#bgGradient)" />
  <rect width="390" height="844" rx="44" stroke="#334155" stroke-width="2" />

  <!-- iOS Status Bar -->
  <g id="StatusBar">
    <text x="36" y="34" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">09:41</text>
    <!-- Dynamic Island / Notch Pill -->
    <rect x="135" y="11" width="120" height="30" rx="15" fill="#000000" />
    <!-- Status Icons -->
    <path d="M326 23C326 21.8954 326.895 21 328 21H348C349.105 21 350 21.8954 350 23V31C350 32.1046 349.105 33 348 33H328C326.895 33 326 32.1046 326 31V23Z" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="328" y="23" width="16" height="8" rx="2" fill="#F8FAFC" />
    <path d="M351 25V29" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M304 31V23M309 31V20M314 31V17M319 31V14" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Navigation Bar -->
  <g id="NavBar" transform="translate(20, 56)">
    <rect width="36" height="36" rx="10" fill="url(#brandGradient)" />
    <text x="18" y="23" fill="#090D16" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">BK</text>
    <text x="46" y="20" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Bengkelku</text>
    <text x="46" y="33" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Live Service Tracking</text>
    
    <!-- Token Badge -->
    <rect x="250" y="6" width="100" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="300" y="22" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">#BK-78921</text>
  </g>

  <!-- Hero Unit Card -->
  <g id="HeroCard" transform="translate(20, 110)">
    <rect width="350" height="126" rx="18" fill="url(#cardGradient)" stroke="#334155" stroke-width="1" />
    <text x="18" y="28" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Kendaraan Servis</text>
    
    <text x="18" y="54" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Honda Vario 160</text>
    <rect x="18" y="66" width="100" height="22" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
    <text x="68" y="81" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">B 4512 KLG</text>

    <!-- Status Pill -->
    <rect x="212" y="16" width="124" height="26" rx="13" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="224" cy="29" r="4" fill="#F59E0B" />
    <text x="274" y="33" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Dikerjakan</text>

    <!-- Mechanic & Entry Time Info -->
    <line x1="18" y1="98" x2="332" y2="98" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <text x="18" y="114" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Mekanik: <tspan fill="#F8FAFC" font-weight="600">Budi (Pit 2)</tspan></text>
    <text x="332" y="114" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="end">Masuk: <tspan fill="#F8FAFC" font-weight="600">10:15 WIB</tspan></text>
  </g>

  <!-- Live Progress Timeline Stepper -->
  <g id="TimelineStepper" transform="translate(20, 252)">
    <rect width="350" height="258" rx="18" fill="url(#cardGradient)" stroke="#334155" stroke-width="1" />
    <text x="18" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Progres Pengerjaan</text>
    <text x="332" y="28" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">Real-time</text>

    <!-- Stepper Connecting Lines -->
    <line x1="38" y1="64" x2="38" y2="114" stroke="#10B981" stroke-width="2" />
    <line x1="38" y1="126" x2="38" y2="176" stroke="#475569" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="38" y1="188" x2="38" y2="226" stroke="#334155" stroke-width="2" />

    <!-- Step 1: Completed -->
    <g transform="translate(26, 50)">
      <circle cx="12" cy="12" r="12" fill="#10B981" />
      <path d="M8 12.5L10.5 15L16 9.5" stroke="#090D16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="34" y="12" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Registrasi Masuk &amp; SPK</text>
      <text x="34" y="26" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Keluhan: Rem bunyi, ganti oli rutin (10:15)</text>
    </g>

    <!-- Step 2: In Progress (Active) -->
    <g transform="translate(26, 114)">
      <circle cx="12" cy="12" r="13" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2" />
      <circle cx="12" cy="12" r="6" fill="#F59E0B" />
      <text x="34" y="12" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Pengerjaan &amp; Penggantian Part</text>
      <text x="34" y="26" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tune Up Injeksi &amp; Bongkar CVT (10:40)</text>
    </g>

    <!-- Step 3: Upcoming -->
    <g transform="translate(26, 178)">
      <circle cx="12" cy="12" r="12" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <circle cx="12" cy="12" r="4" fill="#64748B" />
      <text x="34" y="12" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Pengecekan Akhir &amp; Test Drive</text>
      <text x="34" y="26" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Estimasi siap: 11:30 WIB</text>
    </g>

    <!-- Step 4: Final Ready -->
    <g transform="translate(26, 226)">
      <circle cx="12" cy="12" r="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="34" y="16" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Selesai &amp; Siap Diambil di Kasir</text>
    </g>
  </g>

  <!-- Cost Breakdown Card -->
  <g id="CostCard" transform="translate(20, 524)">
    <rect width="350" height="186" rx="18" fill="url(#cardGradient)" stroke="#334155" stroke-width="1" />
    <text x="18" y="28" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Rincian Estimasi Biaya</text>
    <text x="332" y="28" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">Transparan</text>

    <!-- Line Item 1 -->
    <text x="18" y="58" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Jasa Servis Tune Up Injeksi</text>
    <text x="332" y="58" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="end">Rp 45.000</text>

    <!-- Line Item 2 -->
    <text x="18" y="84" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Oli Mesin MPX2 0.8L (Matic)</text>
    <text x="332" y="84" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="end">Rp 65.000</text>

    <!-- Line Item 3 -->
    <text x="18" y="110" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Kampas Rem Depan Honda</text>
    <text x="332" y="110" fill="#F8FAFC" font-family="monospace" font-size="12" text-anchor="end">Rp 55.000</text>

    <!-- Divider -->
    <line x1="18" y1="126" x2="332" y2="126" stroke="#334155" stroke-width="1" />

    <!-- Total Row -->
    <text x="18" y="152" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Total Tagihan Sementara</text>
    <text x="332" y="156" fill="#F97316" font-family="monospace" font-size="18" font-weight="800" text-anchor="end">Rp 165.000</text>
    <text x="18" y="172" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">*Belum termasuk diskon / penambahan part disetujui</text>
  </g>

  <!-- Floating Action Buttons -->
  <g id="ActionButtons" transform="translate(20, 722)">
    <!-- WhatsApp Action Button -->
    <rect width="350" height="50" rx="14" fill="#10B981" />
    <!-- WA Icon SVG -->
    <path d="M102 25C102 19.4772 106.477 15 112 15H120C125.523 15 130 19.4772 130 25C130 30.5228 125.523 35 120 35H112C106.477 35 102 30.5228 102 25Z" fill="#090D16" fill-opacity="0.1" />
    <path d="M110 32L111 28C109.8 26.2 109.5 24 110.2 22C111.4 18.8 114.8 17 118 18.2C121.2 19.4 123 22.8 121.8 26C120.8 28.5 118.5 30 116 30C115 30 114.2 29.8 113.5 29.5L110 32Z" stroke="#090D16" stroke-width="1.8" stroke-linejoin="round" />
    <text x="188" y="31" fill="#090D16" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Hubungi Bengkel via WhatsApp</text>
  </g>

  <!-- iOS Home Bar Indicator -->
  <g id="HomeBar">
    <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#64748B" />
  </g>
</svg>
