<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <!-- Figma Canvas: Bengkelku End-to-End Operational Flowchart -->
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="boxShadow" x="-10" y="-10" width="1300" height="740" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" rx="24" fill="url(#flowBg)" />
  <rect width="1280" height="720" rx="24" stroke="#334155" stroke-width="2" />

  <!-- Subtle Grid Dots -->
  <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.4" />
  </pattern>
  <rect width="1280" height="720" rx="24" fill="url(#dotPattern)" />

  <!-- Header Section -->
  <g id="Header" transform="translate(60, 40)">
    <rect width="40" height="40" rx="12" fill="url(#headerGrad)" />
    <text x="20" y="26" fill="#090D16" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle">BK</text>
    <text x="56" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Diagram Alur Proses Bisnis &amp; Arsitektur Sistem Bengkelku</text>
    <text x="56" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Integrasi Work Order, Live Service Tracking (No-Login), Kasir, &amp; Automated WhatsApp Reminder</text>
    
    <!-- Version Tag -->
    <rect x="1060" y="10" width="100" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="1110" y="28" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">v1.0 • Figma Kit</text>
  </g>

  <!-- Swimlane / Stage 1: Front Desk (Check-In) -->
  <g id="Stage-1" transform="translate(60, 120)">
    <rect width="260" height="540" rx="20" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect width="260" height="50" rx="20" fill="#1E293B" />
    <circle cx="30" cy="25" r="12" fill="#3B82F6" />
    <text x="30" y="29" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="52" y="23" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Check-in &amp; SPK Masuk</text>
    <text x="52" y="38" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Front Desk / Kasir</text>

    <!-- Node 1.1: Customer Arrival -->
    <g transform="translate(18, 70)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">INPUT REGISTRASI</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Plat No, Odometer &amp; Keluhan</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Auto-lookup riwayat servis lama</text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="144" x2="130" y2="170" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />
    <circle cx="130" cy="157" r="3" fill="#3B82F6" />

    <!-- Node 1.2: Work Order Generated -->
    <g transform="translate(18, 170)">
      <rect width="224" height="84" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">OUTPUT SPK &amp; TOKEN</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Terbitkan Work Order</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Status: <tspan fill="#60A5FA" font-weight="700">ANTRIAN</tspan></text>
      <text x="14" y="74" fill="#FCD34D" font-family="monospace" font-size="10">Token: NanoID/UUID acak</text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="254" x2="130" y2="280" stroke="#3B82F6" stroke-width="2" />
    <circle cx="130" cy="267" r="3" fill="#3B82F6" />

    <!-- Node 1.3: Receipt & QR -->
    <g transform="translate(18, 280)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">TANDA TERIMA FISIK</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Cetak QR Live Tracking</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Diserahkan kepada pelanggan</text>
    </g>

    <!-- Info Pill -->
    <rect x="18" y="470" width="224" height="46" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="130" y="492" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Data tersimpan di Postgres/MySQL</text>
    <text x="130" y="506" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Next.js Server Actions</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <line x1="320" y1="330" x2="360" y2="330" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="360,330 352,325 352,335" fill="#F59E0B" />

  <!-- Swimlane / Stage 2: Workshop Floor (Mekanik) -->
  <g id="Stage-2" transform="translate(360, 120)">
    <rect width="260" height="540" rx="20" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect width="260" height="50" rx="20" fill="#1E293B" />
    <circle cx="30" cy="25" r="12" fill="#F59E0B" />
    <text x="30" y="29" fill="#090D16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="52" y="23" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Pengerjaan &amp; Sparepart</text>
    <text x="52" y="38" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Workshop Floor / Mekanik</text>

    <!-- Node 2.1: Inspection -->
    <g transform="translate(18, 70)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">DIAGNOSIS MEKANIK</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Bongkar &amp; Cek Keluhan</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Update status: <tspan fill="#F59E0B" font-weight="700">PENGERJAAN</tspan></text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="144" x2="130" y2="170" stroke="#F59E0B" stroke-width="2" />
    <circle cx="130" cy="157" r="3" fill="#F59E0B" />

    <!-- Node 2.2: Part Deduction -->
    <g transform="translate(18, 170)">
      <rect width="224" height="84" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">INVENTARIS GUDANG</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Input Pemakaian Part</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Stok otomatis dipotong</text>
      <text x="14" y="74" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="10">Katalog oli, kampas, busi, dll</text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="254" x2="130" y2="280" stroke="#F59E0B" stroke-width="2" />
    <circle cx="130" cy="267" r="3" fill="#F59E0B" />

    <!-- Node 2.3: Service Complete -->
    <g transform="translate(18, 280)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">FINAL QUALITY CHECK</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Selesai Uji Kendaraan</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Status: <tspan fill="#34D399" font-weight="700">SELESAI_SERVIS</tspan></text>
    </g>

    <!-- Info Pill -->
    <rect x="18" y="470" width="224" height="46" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="130" y="492" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Otomatis update ke halaman</text>
    <text x="130" y="506" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Live Service Tracking Pelanggan</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <line x1="620" y1="330" x2="660" y2="330" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="660,330 652,325 652,335" fill="#10B981" />

  <!-- Swimlane / Stage 3: Cashier & Live Tracking (Billing) -->
  <g id="Stage-3" transform="translate(660, 120)">
    <rect width="260" height="540" rx="20" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect width="260" height="50" rx="20" fill="#1E293B" />
    <circle cx="30" cy="25" r="12" fill="#10B981" />
    <text x="30" y="29" fill="#090D16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">3</text>
    <text x="52" y="23" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Billing &amp; Live Tracking</text>
    <text x="52" y="38" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Kasir &amp; Pemilik Kendaraan</text>

    <!-- Node 3.1: Live Tracking View -->
    <g transform="translate(18, 70)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">CUSTOMER TRANSPARENCY</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Pantau via Smartphone</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Tanpa login: /track/[token]</text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="144" x2="130" y2="170" stroke="#10B981" stroke-width="2" />
    <circle cx="130" cy="157" r="3" fill="#10B981" />

    <!-- Node 3.2: Payment Process -->
    <g transform="translate(18, 170)">
      <rect width="224" height="84" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">KASIR &amp; PEMBAYARAN</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Kalkulasi Jasa + Part</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Tunai / Transfer Manual</text>
      <text x="14" y="74" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="10">Hitung uang kembalian</text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="254" x2="130" y2="280" stroke="#10B981" stroke-width="2" />
    <circle cx="130" cy="267" r="3" fill="#10B981" />

    <!-- Node 3.3: Invoice Issued -->
    <g transform="translate(18, 280)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">PELUNASAN SELESAI</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Cetak Faktur Lunas</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Struk thermal / Nota PDF</text>
    </g>

    <!-- Info Pill -->
    <rect x="18" y="470" width="224" height="46" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="130" y="492" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Riwayat terkunci abadi per plat nomor</text>
    <text x="130" y="506" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Status: SELESAI_PEMBAYARAN</text>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <line x1="920" y1="330" x2="960" y2="330" stroke="#F97316" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="960,330 952,325 952,335" fill="#F97316" />

  <!-- Swimlane / Stage 4: Retention & WhatsApp Automation -->
  <g id="Stage-4" transform="translate(960, 120)">
    <rect width="260" height="540" rx="20" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect width="260" height="50" rx="20" fill="#1E293B" />
    <circle cx="30" cy="25" r="12" fill="#F97316" />
    <text x="30" y="29" fill="#090D16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="52" y="23" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Siklus Retensi WhatsApp</text>
    <text x="52" y="38" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Automated Retention Engine</text>

    <!-- Node 4.1: Timer Trigger -->
    <g transform="translate(18, 70)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#FED7AA" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">ALGORITMA INTERVAL</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Deteksi 60–90 Hari</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Delta waktu dari servis terakhir</text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="144" x2="130" y2="170" stroke="#F97316" stroke-width="2" />
    <circle cx="130" cy="157" r="3" fill="#F97316" />

    <!-- Node 4.2: 1-Click Reminder -->
    <g transform="translate(18, 170)">
      <rect width="224" height="84" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">1-CLICK TRIGGER</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Kirim WhatsApp Personal</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">wa.me/{phone}?text={pesan}</text>
      <text x="14" y="74" fill="#FED7AA" font-family="system-ui, -apple-system, sans-serif" font-size="10">Reservasi jadwal kembali</text>
    </g>

    <!-- Arrow Down -->
    <line x1="130" y1="254" x2="130" y2="280" stroke="#F97316" stroke-width="2" />
    <circle cx="130" cy="267" r="3" fill="#F97316" />

    <!-- Node 4.3: Customer Return -->
    <g transform="translate(18, 280)">
      <rect width="224" height="74" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="24" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">REPEAT ORDER</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Pelanggan Datang Lagi</text>
      <text x="14" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Retensi naik +35%</text>
    </g>

    <!-- Loop Back Indicator to Stage 1 -->
    <path d="M130 354 V440 H-770 V360" stroke="#F97316" stroke-width="2" stroke-dasharray="6 6" fill="none" />
    <polygon points="-770,354 -775,364 -765,364" fill="#F97316" />
    <rect x="-420" y="425" width="200" height="26" rx="13" fill="#1E293B" stroke="#F97316" stroke-width="1" />
    <text x="-320" y="442" fill="#FED7AA" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Siklus Servis Berkala Berulang</text>

    <!-- Info Pill -->
    <rect x="18" y="470" width="224" height="46" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="130" y="492" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Tanpa biaya WhatsApp Gateway pihak ke-3</text>
    <text x="130" y="506" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">100% Free &amp; Human-in-the-Loop</text>
  </g>
</svg>
